name: Reusable - Docker


on:
  workflow_call:
    inputs:
      docker_file:
        default: docker/archivist.Dockerfile
        description: Dockerfile
        required: false
        type: string
      docker_repo:
        default: durabilitylabs/archivist-node
        description: DockerHub repository
        required: false
        type: string
      nimflags:
        default: '-d:disableMarchNative -d:nimleopard_portable_build'
        description: Nim flags for builds
        required: false
        type: string
      nat_ip_auto:
        default: false
        description: Enable NAT IP auto
        required: false
        type: boolean
      tag_latest:
        default: true
        description: Set latest tag for Docker images
        required: false
        type: boolean
      tag_stable:
        default: false
        description: Set stable tag for Docker images
        required: false
        type: boolean
      tag_sha:
        default: true
        description: Set Git short commit as Docker tag
        required: false
        type: boolean
      tag_suffix:
        default: ''
        description: Suffix for Docker images tag
        required: false
        type: string
      run_release_tests:
        description: Run Release tests
        required: false
        type: string
        default: false
      release_tests_namespace:
        description: Kubernetes namespace for release tests
        required: false
        type: string
        default: 'devnet'
      release_tests_runner_image:
        description: Release-test runner image override
        required: false
        type: string
      release_tests_runner_image_pull_policy:
        description: Pull policy override for the release-test runner image
        required: false
        type: string
      release_tests_archivistdockerimage:
        description: Archivist image override passed to release tests
        required: false
        type: string
      release_tests_image_pull_policy:
        description: Default pull policy override for release-test child deployments
        required: false
        type: string
      release_tests_archivist_image_pull_policy:
        description: Pull policy override for Archivist child deployments
        required: false
        type: string
      release_tests_archivist_contracts_image:
        description: Contracts image override passed to release tests
        required: false
        type: string
      release_tests_archivist_contracts_image_pull_policy:
        description: Pull policy override for contracts child deployments
        required: false
        type: string
      release_tests_geth_docker_image:
        description: Geth image override passed to release tests
        required: false
        type: string
      release_tests_geth_image_pull_policy:
        description: Pull policy override for geth child deployments
        required: false
        type: string
      release_tests_prometheus_docker_image:
        description: Prometheus image override passed to release tests
        required: false
        type: string
      release_tests_prometheus_image_pull_policy:
        description: Pull policy override for Prometheus child deployments
        required: false
        type: string
      release_tests_archivist_discordbot_image:
        description: Discord bot image override passed to release tests
        required: false
        type: string
      release_tests_archivist_discordbot_image_pull_policy:
        description: Pull policy override for Discord bot child deployments
        required: false
        type: string
      release_tests_archivist_rewarderbot_image:
        description: Rewarder bot image override passed to release tests
        required: false
        type: string
      release_tests_archivist_rewarderbot_image_pull_policy:
        description: Pull policy override for rewarder bot child deployments
        required: false
        type: string
      contract_image:
        description: Specifies compatible smart contract image
        required: false
        type: string
    outputs:
      archivist_image:
        description: Archivist Docker image tag
        value: ${{ jobs.publish.outputs.archivist_image }}


env:
  # Build
  DOCKER_FILE: ${{ inputs.docker_file }}
  DOCKER_REPO: ${{ inputs.docker_repo }}
  NIMFLAGS: ${{ inputs.nimflags }}
  NAT_IP_AUTO: ${{ inputs.nat_ip_auto }}
  TAG_LATEST: ${{ inputs.tag_latest }}
  TAG_STABLE: ${{ inputs.tag_stable }}
  TAG_SHA: ${{ inputs.tag_sha }}
  TAG_SUFFIX: ${{ inputs.tag_suffix }}
  CONTRACT_IMAGE: ${{ inputs.contract_image }}


jobs:
  # Compute variables
  compute:
    name: Compute build ID
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.build_id }}
    steps:
      - name: Generate unique build id
        id: build_id
        run: echo "build_id=$(openssl rand -hex 5)" >> $GITHUB_OUTPUT

  # Build platform specific image
  build:
    needs: compute
    strategy:
      fail-fast: true
      matrix:
        target:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
        include:
          - target:
              os: linux
              arch: amd64
            builder: ubuntu-24.04
          - target:
              os: linux
              arch: arm64
            builder: ubuntu-24.04-arm

    name: Build ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ${{ matrix.builder }}
    env:
      PLATFORM: ${{ format('{0}/{1}', 'linux', matrix.target.arch) }}
    steps:
      - name: Show runner info
        run: |
          curl -sLO https://raw.githubusercontent.com/HenrikBengtsson/x86-64-level/main/x86-64-level
          chmod ugo+x x86-64-level
          ./x86-64-level --verbose || true

          for run in "lscpu" "lshw -class processor" "dmidecode -t processor"; do
            echo -e "\n\n";
            echo "${run}";
            eval sudo ${run};
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker - Variables
        run: |
          # Create contract label for compatible contract image if specified
          if [[ -n "${{ env.CONTRACT_IMAGE }}" ]]; then
            echo "CONTRACT_LABEL=storage.archivist.archivist-node.blockchain-image=${{ env.CONTRACT_IMAGE }}" >> $GITHUB_ENV
          fi

      - name: Docker - Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}
          labels: ${{ env.CONTRACT_LABEL }}

      - name: Docker - Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker - Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Build and Push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKER_FILE }}
          platforms: ${{ env.PLATFORM }}
          push: true
          build-args: |
            NIMFLAGS=${{ env.NIMFLAGS }}
            NAT_IP_AUTO=${{ env.NAT_IP_AUTO }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Docker - Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Docker - Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.compute.outputs.build_id }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1


  # Publish multi-platform image
  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      archivist_image: ${{ steps.image_tag.outputs.archivist_image }}
    needs: [build, compute]
    steps:
      - name: Docker - Variables
        run: |
          # Adjust custom suffix when set
          if [[ -n "${{ env.TAG_SUFFIX }}" ]]; then
            echo "TAG_SUFFIX=-${{ env.TAG_SUFFIX }}" >> $GITHUB_ENV
          fi
          # Disable SHA tags on tagged release
          if [[ ${{ startsWith(github.ref, 'refs/tags/') }} == "true" ]]; then
            echo "TAG_SHA=false" >> $GITHUB_ENV
          fi
          # Handle latest and latest-custom using raw
          if [[ ${{ env.TAG_SHA }} == "false" ]]; then
            echo "TAG_LATEST=false" >> $GITHUB_ENV
            echo "TAG_RAW=true" >> $GITHUB_ENV
            if [[ -z "${{ env.TAG_SUFFIX }}" ]]; then
              echo "TAG_RAW_VALUE=latest" >> $GITHUB_ENV
            else
              echo "TAG_RAW_VALUE=latest-{{ env.TAG_SUFFIX }}" >> $GITHUB_ENV
            fi
          else
            echo "TAG_RAW=false" >> $GITHUB_ENV
          fi
          
          # Create contract label for compatible contract image if specified
          if [[ -n "${{ env.CONTRACT_IMAGE }}" ]]; then
            echo "CONTRACT_LABEL=storage.archivist.archivist-node.blockchain-image=${{ env.CONTRACT_IMAGE }}" >> $GITHUB_ENV
          fi

      - name: Docker - Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ needs.compute.outputs.build_id }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Docker - Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker - Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}
          labels: ${{ env.CONTRACT_LABEL }}
          flavor: |
            latest=${{ env.TAG_LATEST }}
            suffix=${{ env.TAG_SUFFIX }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,enable=${{ env.TAG_RAW }},value=latest
            type=raw,enable=${{ env.TAG_STABLE }},value=stable
            type=sha,enable=${{ env.TAG_SHA }}

      - name: Docker - Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKER_REPO }}@sha256:%s ' *)

      - name: Docker - Image tag
        id: image_tag
        run: echo "archivist_image=${{ env.DOCKER_REPO }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Docker - Inspect image
        run: docker buildx imagetools inspect ${{ steps.image_tag.outputs.archivist_image }}


  # Compute Tests inputs
  compute-tests-inputs:
    name: Compute Tests inputs
    if: ${{ inputs.run_release_tests == 'true' }}
    runs-on: ubuntu-latest
    needs: publish
    outputs:
      source: ${{ steps.compute.outputs.source }}
      branch: ${{ steps.compute.outputs.branch }}
      workflow_source: ${{ steps.compute.outputs.workflow_source }}
      archivistdockerimage: ${{ steps.compute.outputs.archivistdockerimage }}
      runner_image: ${{ steps.compute.outputs.runner_image }}
      runner_image_pull_policy: ${{ steps.compute.outputs.runner_image_pull_policy }}
      image_pull_policy: ${{ steps.compute.outputs.image_pull_policy }}
      archivist_image_pull_policy: ${{ steps.compute.outputs.archivist_image_pull_policy }}
      archivist_contracts_image: ${{ steps.compute.outputs.archivist_contracts_image }}
      archivist_contracts_image_pull_policy: ${{ steps.compute.outputs.archivist_contracts_image_pull_policy }}
      geth_docker_image: ${{ steps.compute.outputs.geth_docker_image }}
      geth_image_pull_policy: ${{ steps.compute.outputs.geth_image_pull_policy }}
      prometheus_docker_image: ${{ steps.compute.outputs.prometheus_docker_image }}
      prometheus_image_pull_policy: ${{ steps.compute.outputs.prometheus_image_pull_policy }}
      archivist_discordbot_image: ${{ steps.compute.outputs.archivist_discordbot_image }}
      archivist_discordbot_image_pull_policy: ${{ steps.compute.outputs.archivist_discordbot_image_pull_policy }}
      archivist_rewarderbot_image: ${{ steps.compute.outputs.archivist_rewarderbot_image }}
      archivist_rewarderbot_image_pull_policy: ${{ steps.compute.outputs.archivist_rewarderbot_image_pull_policy }}
    steps:
      - name: Compute Tests inputs
        id: compute
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          release_tests_archivistdockerimage="$(trim "${{ inputs.release_tests_archivistdockerimage }}")"

          echo "source=https://github.com/durability-labs/cs-archivist-dist-tests" >> "$GITHUB_OUTPUT"
          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "workflow_source=durability-labs/cs-archivist-dist-tests" >> "$GITHUB_OUTPUT"
          if [[ -n "${release_tests_archivistdockerimage}" ]]; then
            echo "archivistdockerimage=${release_tests_archivistdockerimage}" >> "$GITHUB_OUTPUT"
          else
            echo "archivistdockerimage=${{ inputs.docker_repo }}:${{ needs.publish.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "runner_image=${{ inputs.release_tests_runner_image }}" >> "$GITHUB_OUTPUT"
          echo "runner_image_pull_policy=${{ inputs.release_tests_runner_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "image_pull_policy=${{ inputs.release_tests_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "archivist_image_pull_policy=${{ inputs.release_tests_archivist_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "archivist_contracts_image=${{ inputs.release_tests_archivist_contracts_image }}" >> "$GITHUB_OUTPUT"
          echo "archivist_contracts_image_pull_policy=${{ inputs.release_tests_archivist_contracts_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "geth_docker_image=${{ inputs.release_tests_geth_docker_image }}" >> "$GITHUB_OUTPUT"
          echo "geth_image_pull_policy=${{ inputs.release_tests_geth_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "prometheus_docker_image=${{ inputs.release_tests_prometheus_docker_image }}" >> "$GITHUB_OUTPUT"
          echo "prometheus_image_pull_policy=${{ inputs.release_tests_prometheus_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "archivist_discordbot_image=${{ inputs.release_tests_archivist_discordbot_image }}" >> "$GITHUB_OUTPUT"
          echo "archivist_discordbot_image_pull_policy=${{ inputs.release_tests_archivist_discordbot_image_pull_policy }}" >> "$GITHUB_OUTPUT"
          echo "archivist_rewarderbot_image=${{ inputs.release_tests_archivist_rewarderbot_image }}" >> "$GITHUB_OUTPUT"
          echo "archivist_rewarderbot_image_pull_policy=${{ inputs.release_tests_archivist_rewarderbot_image_pull_policy }}" >> "$GITHUB_OUTPUT"


  # Run Release Tests
  run-release-tests:
    name: Run Release Tests
    needs: [publish, compute-tests-inputs]
    if: ${{ inputs.run_release_tests == 'true' }}
    uses: durability-labs/cs-archivist-dist-tests/.github/workflows/run-release-tests.yaml@main
    with:
      source: ${{ needs.compute-tests-inputs.outputs.source }}
      branch: ${{ needs.compute-tests-inputs.outputs.branch }}
      runner_image: ${{ needs.compute-tests-inputs.outputs.runner_image }}
      runner_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.runner_image_pull_policy }}
      image_pull_policy: ${{ needs.compute-tests-inputs.outputs.image_pull_policy }}
      archivistdockerimage: ${{ needs.compute-tests-inputs.outputs.archivistdockerimage }}
      archivist_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.archivist_image_pull_policy }}
      archivist_contracts_image: ${{ needs.compute-tests-inputs.outputs.archivist_contracts_image }}
      archivist_contracts_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.archivist_contracts_image_pull_policy }}
      geth_docker_image: ${{ needs.compute-tests-inputs.outputs.geth_docker_image }}
      geth_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.geth_image_pull_policy }}
      prometheus_docker_image: ${{ needs.compute-tests-inputs.outputs.prometheus_docker_image }}
      prometheus_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.prometheus_image_pull_policy }}
      archivist_discordbot_image: ${{ needs.compute-tests-inputs.outputs.archivist_discordbot_image }}
      archivist_discordbot_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.archivist_discordbot_image_pull_policy }}
      archivist_rewarderbot_image: ${{ needs.compute-tests-inputs.outputs.archivist_rewarderbot_image }}
      archivist_rewarderbot_image_pull_policy: ${{ needs.compute-tests-inputs.outputs.archivist_rewarderbot_image_pull_policy }}
      workflow_source: ${{ needs.compute-tests-inputs.outputs.workflow_source }}
      namespace: ${{ inputs.release_tests_namespace || 'devnet' }}
    secrets:
      KUBE_CONFIG: ${{ secrets.DEVNET_KUBE_CONFIG }}
