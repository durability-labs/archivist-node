name: Reusable -  CI

on:
  workflow_call:
    inputs:
      matrix:
        type: string

jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJson(inputs.matrix) }}

    name: ${{ matrix.builder }}-${{ matrix.tests }}-${{ matrix.job_number }}
    runs-on: ${{ matrix.builder }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Nim
        uses: iffy/install-nim@v5
        with:
          version: binary:2.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Setup Rust for Windows
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.79.0-x86_64-pc-windows-gnu
          rustup default 1.79.0-x86_64-pc-windows-gnu

      - name: Setup Node.js
        if: matrix.tests == 'contract' || matrix.tests == 'integration' || matrix.tests == 'tools'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: nimble install -y
        env:
          TMP: ${{ runner.temp }}

      - name: Unit tests
        if: matrix.tests == 'unittest'
        run: nimble test

      - name: Contract tests
        if: matrix.tests == 'contract'
        run: nimble testContracts

      - name: Integration tests
        if: matrix.tests == 'integration'
        env:
          ARCHIVIST_INTEGRATION_TEST_INCLUDES: ${{ matrix.includes }}
        run: nimble testIntegration

      - name: Tools tests
        if: matrix.tests == 'tools'
        run: nimble testTools

      - name: Upload integration tests log files
        uses: actions/upload-artifact@v4
        if: always() && matrix.tests == 'integration'
        with:
          name: ${{ matrix.builder }}-${{ matrix.job_number }}-integration-tests-logs
          path: logs/testbed
          retention-days: 1

  status:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')  || contains(needs.*.result, 'skipped') }}
        run: exit 1
